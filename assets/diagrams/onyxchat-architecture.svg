<svg width="680" height="428" viewBox="0 0 680 428" xmlns="http://www.w3.org/2000/svg" role="img">
<title>OnyxChat architecture</title>
<desc>A browser client connects through a load balancer into an AWS VPC, where stateless Fargate tasks use Redis pub/sub for cross-instance message fanout and write to PostgreSQL for persistence.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="230" y="40" width="220" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="58" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Browser client</text>
<text x="340" y="76" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">Keys never leave device</text>

<line x1="340" y1="96" x2="340" y2="130" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="230" y="130" width="220" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="148" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Load balancer</text>
<text x="340" y="166" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">No sticky sessions</text>

<line x1="340" y1="186" x2="340" y2="234" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="190" width="600" height="198" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="64" y="214" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">AWS VPC — private subnet</text>

<rect x="260" y="224" width="180" height="56" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<rect x="250" y="234" width="180" height="56" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="252" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Fargate tasks</text>
<text x="340" y="270" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">Stateless pool</text>

<rect x="470" y="234" width="150" height="56" rx="8" fill="#F0997B" stroke="#993C1D" stroke-width="0.5"/>
<text x="545" y="252" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Redis pub/sub</text>
<text x="545" y="270" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">Cross-instance</text>

<line x1="430" y1="262" x2="470" y2="262" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="290" x2="340" y2="312" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="250" y="312" width="180" height="56" rx="8" fill="#AFA9EC" stroke="#3C3489" stroke-width="0.5"/>
<text x="340" y="330" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">PostgreSQL</text>
<text x="340" y="348" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">Encrypted messages</text>
</svg>
