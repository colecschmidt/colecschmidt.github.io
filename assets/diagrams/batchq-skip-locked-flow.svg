<svg width="680" height="332" viewBox="0 0 680 332" xmlns="http://www.w3.org/2000/svg" role="img">
<title>BatchQ SKIP LOCKED flow</title>
<desc>Two workers query the jobs table concurrently. Worker A claims Row 1. Worker B's query would normally block on Row 1's lock, but SKIP LOCKED lets it skip past and claim Row 2 instead, so neither worker waits and neither double-processes a job.</desc>
<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="110" y="40" width="160" height="56" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="190" y="58" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Worker A</text>
<text x="190" y="76" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">Claims next row</text>

<rect x="410" y="40" width="160" height="56" rx="8" fill="#F0997B" stroke="#993C1D" stroke-width="0.5"/>
<text x="490" y="58" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Worker B</text>
<text x="490" y="76" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">Claims next row</text>

<line x1="190" y1="96" x2="200" y2="216" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow2)"/>
<line x1="490" y1="96" x2="200" y2="216" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow2)"/>
<line x1="490" y1="96" x2="340" y2="216" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow2)"/>

<rect x="40" y="170" width="600" height="122" rx="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="64" y="192" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">jobs table</text>

<rect x="140" y="216" width="120" height="56" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="200" y="234" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Row 1</text>
<text x="200" y="252" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">locked: A</text>

<rect x="280" y="216" width="120" height="56" rx="8" fill="#F0997B" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="234" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Row 2</text>
<text x="340" y="252" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">locked: B</text>

<rect x="420" y="216" width="120" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="480" y="234" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Row 3</text>
<text x="480" y="252" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">pending</text>
</svg>
